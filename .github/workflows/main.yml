name: Windows CI - Build C++ raylib Game

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build with build.bat
        run: |
          .\build.bat

      - name: Verify build outputs
        run: |
          bin\game.exe
