name: Windows CI - Build C++ raylib Game

permissions:
  contents: write 

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1.4.1

      - name: Build The Game
        run: |
          .\scripts\msvc-build-raylib.bat
          .\scripts\msvc-build-debug.bat

      - name: Prepare Release Files
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release -Force
          Copy-Item bin/* release/ -Recurse -Force
          Copy-Item assets/ release/assets/ -Recurse -Force
          Compress-Archive -Path release/* -DestinationPath release.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.JASON_TOKEN }}
          tag: ${{ github.ref }}
          overwrite: true
          body: "This is my release text"
          file: release.zip